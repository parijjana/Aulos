name: aulos
description: "Aulos — an offline-first, multi-domain local audio player for Music, Podcasts, Audiobooks, Radio, and Ambient Noise."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  themer_flutter:
    path: packages/themer_sdk
  just_audio: ^0.10.5
  # 1.4.0 is the last flutter_rust_bridge v1 release. >=1.4.3 (frb v2) ships a
  # macOS pod whose binary omits the v1-style symbols its own shim references,
  # so the macOS link fails. Do not bump without testing `flutter build macos`.
  audiotags: 1.4.0
  file: ^7.0.1
  nsd: ^5.0.1
  qr_flutter: ^4.1.0
  encrypt: ^5.0.3
  qr_secure_handshake:
    path: packages/qr_secure_handshake
  shared_preferences: ^2.5.5
  file_picker: ^12.0.0-beta.7
  provider: ^6.1.5+1
  path: ^1.9.1
  drift: ^2.32.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  audio_session: ^0.2.3
  just_audio_windows: ^0.2.3
  window_manager: ^0.5.1
  permission_handler: ^12.0.3
  audio_service: ^0.18.18
  on_audio_query_pluse: ^3.0.7
  platform: ^3.1.6
  app_links: ^7.0.0
  network_info_plus: ^8.2.0
  cryptography: ^2.9.0
  uuid: ^4.5.3
  palette_generator: ^0.3.3+7
  media_fetcher:
    path: packages/media_fetcher
  image: ^4.8.0
  dart_rss: ^3.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  audio_video_progress_bar: ^2.0.3
  archive: ^4.0.9
  xxh3: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  test: ^1.30.0
  drift_dev: ^2.32.1
  build_runner: ^2.15.0
  flutter_driver:
    sdk: flutter
  yaml: ^3.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/noise/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter[opsz,wght].ttf
        - asset: assets/fonts/Inter/Inter-Italic[opsz,wght].ttf
          style: italic

